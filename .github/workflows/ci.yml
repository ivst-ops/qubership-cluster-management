name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # A fork's PR and a Dependabot PR get a read-only token (no packages: write) and no repository secrets:
      # build the image without publishing and pass it to the jobs as an artifact.
      LOCAL: >-
        ${{ github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' ||
        github.event.pull_request.head.repo.full_name != github.repository) }}
    outputs:
      image: ${{ steps.ref.outputs.image || 'qcm-tools:local' }}
      local: ${{ env.LOCAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.LOCAL == 'true'
      # devbox.json: Task and the other developer tools, as in `devbox shell`.
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        if: env.LOCAL == 'true'
        with:
          devbox-version: 0.18.4
          enable-cache: true
      - name: Check Docker versions
        if: env.LOCAL == 'true'
        run: devbox run -- task doctor
      - name: Build tools image locally
        if: env.LOCAL == 'true'
        run: devbox run -- task image:release && docker save -o "$RUNNER_TEMP/tools-image.tar" qcm-tools:local
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.LOCAL == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}/tools-image.tar
          retention-days: 1
      - name: Build and publish tools image
        if: env.LOCAL != 'true'
        id: build
        uses: netcracker/qubership-workflow-hub/actions/docker-action@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          custom-image-name: ${{ github.event.repository.name }}-tools
          tags: ${{ github.sha }}${{ github.ref == 'refs/heads/main' && ',latest' || '' }}
          setup-qemu: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference
        if: env.LOCAL != 'true'
        id: ref
        env:
          TAGS: ${{ steps.build.outputs.final-tags }}
        run: echo "image=${TAGS%%,*}" >> "$GITHUB_OUTPUT"

  validate:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # devbox.json: Task and the other developer tools, as in `devbox shell`.
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          devbox-version: 0.18.4
          enable-cache: true
      - name: Check Docker versions
        run: devbox run -- task doctor
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.outputs.local == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}
      - name: Get tools image
        env:
          LOCAL: ${{ needs.image.outputs.local }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $LOCAL == true ]]; then docker load -i "$RUNNER_TEMP/tools-image.tar"
          else echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; fi
      - name: Validate stacks, OpenTofu modules and scripts
        run: devbox run -- task test IMAGE=${{ needs.image.outputs.image }}

  deploy:
    needs: [image, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: customer1-aws-staging
            vars: CLOUD=aws CUSTOMER=customer1
          - stack: customer2-aws-staging
            vars: CLOUD=aws CUSTOMER=customer2 KEEP=true
          - stack: customer1-azure-staging
            vars: CLOUD=azure CUSTOMER=customer1
    name: deploy (${{ matrix.stack }})
    env:
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # devbox.json: Task and the other developer tools, as in `devbox shell`.
      - uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
        with:
          devbox-version: 0.18.4
          enable-cache: true
      - name: Check Docker versions
        run: devbox run -- task doctor
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image.outputs.local == 'true'
        with:
          name: tools-image
          path: ${{ runner.temp }}
      - name: Get tools image
        env:
          LOCAL: ${{ needs.image.outputs.local }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ $LOCAL == true ]]; then docker load -i "$RUNNER_TEMP/tools-image.tar"
          else echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin; fi
      # Taskfile.yml: emulator and tools container up, deploy workflow, cluster check, destroy workflow.
      - name: Deploy and destroy on the emulator
        run: devbox run -- task e2e IMAGE="$IMAGE" ${{ matrix.vars }}
      # The deploy and destroy steps of task e2e write one archive each (task -d local logs:run) into the checkout.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.stack }}-attempt${{ github.run_attempt }}
          path: .local-runtime/logs/*.tar.gz
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: devbox run -- task lab:diagnostics IMAGE="$IMAGE" ${{ matrix.vars }}
