import:
  - customers/customer2/aws/_defaults
  - catalog/aws/network
  - catalog/aws/kubernetes
  - catalog/helmfile/argocd
  - catalog/helmfile/istio
  - catalog/helmfile/kiali
  - catalog/helmfile/minio
  - catalog/helmfile/headlamp
vars:
  stage: staging
  # Environment names carry the suffix of the lab environment (-sN, none in slot 0): Floci names Docker containers
  # and volumes after them, and labs of several checkouts share one Docker host.
  environment: 'customer2-staging{{ env "QCM_LAB_SUFFIX" }}'
env:
  KUBECONFIG: ../../../.local-runtime/kubeconfig-customer2-aws-staging.yaml
helmfile:
  vars:
    # Floci lab: images come from the Internet on first pull (istiod took 10m7s once), so give helm 20 minutes.
    # Per component: components.helmfile.<name>.vars.helm_timeout. Default in the helmfiles: 600.
    helm_timeout: 1200
components:
  terraform:
    kubernetes:
      metadata:
        terraform_workspace: customer2-aws-staging
    network:
      metadata:
        terraform_workspace: customer2-aws-staging
      vars:
        vpc_cidr: '10.{{ add 50 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.0.0/16'
        subnets:
          a:
            cidr_block: '10.{{ add 50 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.1.0/24'
            availability_zone: us-east-1a
          b:
            cidr_block: '10.{{ add 50 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.2.0/24'
            availability_zone: us-east-1b
  helmfile:
    argocd:
      vars:
        values:
          server:
            replicas: 3
            service:
              type: ClusterIP
