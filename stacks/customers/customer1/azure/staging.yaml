import:
  - customers/customer1/azure/_defaults
  - catalog/azure/network
  - catalog/azure/kubernetes
  - catalog/azure/load-balancer
  - catalog/helmfile/argocd
  - catalog/helmfile/istio
  - catalog/helmfile/kiali
  - catalog/helmfile/minio
  - catalog/helmfile/headlamp
vars:
  stage: staging
  # Environment names carry the suffix of the lab environment (-sN, none in slot 0): Floci names Docker containers
  # and volumes after them, and labs of several checkouts share one Docker host.
  environment: 'customer1-azure-staging{{ env "QCM_LAB_SUFFIX" }}'
settings:
  local_azure_lab: true
env:
  ARM_METADATA_HOSTNAME: 'localhost:{{ env "QCM_LAB_AZURE_PORT" | default "4577" }}'
  ARM_USE_CLI: "false"
  ARM_SUBSCRIPTION_ID: 00000000-0000-0000-0000-000000000001
  ARM_TENANT_ID: 00000000-0000-0000-0000-000000000002
  ARM_CLIENT_ID: 00000000-0000-0000-0000-000000000003
  ARM_CLIENT_SECRET: fake-secret
  NO_PROXY: localhost,127.0.0.1,::1
  KUBECONFIG: ../../../.local-runtime/kubeconfig-customer1-azure-staging.yaml
helmfile:
  vars:
    # Floci lab: images come from the Internet on first pull (istiod took 10m7s once), so give helm 20 minutes.
    # Per component: components.helmfile.<name>.vars.helm_timeout. Default in the helmfiles: 600.
    helm_timeout: 1200
components:
  terraform:
    network:
      metadata:
        terraform_workspace: customer1-azure-staging
      vars:
        vpc_cidr: '10.{{ add 60 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.0.0/16'
        subnets:
          kubernetes:
            cidr_block: '10.{{ add 60 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.1.0/24'
    kubernetes:
      metadata:
        terraform_workspace: customer1-azure-staging
      vars:
        node_count: 1
        manage_network_role_assignment: false
        # The local lab reaches the API from outside; a real stack lists its operator and runner CIDRs.
        api_server_authorized_ip_ranges: ["0.0.0.0/0"]
    load-balancer:
      metadata:
        terraform_workspace: customer1-azure-staging
      vars:
        frontend_port: 80
        backend_port: 30081
        # Current Floci k3s Docker address; recheck after cluster recreation.
        backend_addresses:
          kubernetes: 172.19.0.3
