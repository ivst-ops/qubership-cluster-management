import:
  - customers/customer1/aws/_defaults
  - catalog/aws/network
  # The lab exercises the endpoints of the private-network profile on Floci (its subnets keep the Internet route).
  - catalog/aws/private-network
  - catalog/aws/kubernetes
  - catalog/aws/load-balancer
  - catalog/aws/nexus
  - catalog/helmfile/argocd
  - catalog/helmfile/istio
  - catalog/helmfile/kiali
  - catalog/helmfile/minio
  - catalog/helmfile/headlamp
  - catalog/kubernetes/nginx
  - catalog/helmfile/traefik
  - catalog/kubernetes/ingress-wait
  - catalog/kubernetes/job-wait
  - catalog/kubernetes/manifest-wait
vars:
  stage: staging
  # Environment names carry the suffix of the lab environment (-sN, none in slot 0): Floci names Docker containers
  # and volumes after them, and labs of several checkouts share one Docker host.
  environment: 'customer1-staging{{ env "QCM_LAB_SUFFIX" }}'
env:
  KUBECONFIG: ../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
helmfile:
  vars:
    # Floci lab: images come from the Internet on first pull (istiod took 10m7s once), so give helm 20 minutes.
    # Per component: components.helmfile.<name>.vars.helm_timeout. Default in the helmfiles: 600.
    helm_timeout: 1200
components:
  terraform:
    nexus:
      metadata:
        terraform_workspace: customer1-aws-staging
    load-balancer:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        kubeconfig_path: ../../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
    kubernetes:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        # The local lab reaches the API from outside the VPC; a real stack lists its operator and runner CIDRs.
        public_access_cidrs: ["0.0.0.0/0"]
    network:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        vpc_cidr: '10.{{ add 40 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.0.0/16'
        subnets:
          a:
            cidr_block: '10.{{ add 40 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.1.0/24'
            availability_zone: us-east-1a
          b:
            cidr_block: '10.{{ add 40 (mul 16 (env "QCM_LAB_SLOT" | default "0" | atoi)) }}.2.0/24'
            availability_zone: us-east-1b
    nginx:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        kubeconfig_path: ../../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
    ingress-wait:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        kubeconfig_path: ../../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
    job-wait:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        kubeconfig_path: ../../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
    manifest-wait:
      metadata:
        terraform_workspace: customer1-aws-staging
      vars:
        kubeconfig_path: ../../../../.local-runtime/kubeconfig-customer1-aws-staging.yaml
  helmfile:
    argocd:
      vars:
        values:
          server:
            replicas: 2
            service:
              type: NodePort
