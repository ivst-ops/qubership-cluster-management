base_path: "."
components:
  terraform:
    # OpenTofu runs the components; Atmos keeps the `terraform` component type, subcommands and !terraform.state.
    command: tofu
    base_path: components/terraform
  helmfile:
    base_path: components/helmfile
    use_eks: false
stacks:
  base_path: stacks
  included_paths: ["customers/**/*.yaml"]
  excluded_paths: ["**/_defaults.yaml"]
  name_template: "{{ .vars.tenant }}-{{ .vars.cloud }}-{{ .vars.stage }}"
workflows:
  base_path: workflows
# Go templates in stack manifests, with Sprig: the local lab stacks take their environment names, endpoints and VPC
# ranges from the lab environment of the checkout (QCM_LAB_* in the tools container, see local/lab-env.sh).
templates:
  settings:
    enabled: true
    sprig:
      enabled: true
    gomplate:
      enabled: false
